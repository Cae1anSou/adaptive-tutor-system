events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    
    # Gzip压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # 前端静态文件服务
    server {
        listen       80;
        server_name  localhost;
        
        # 静态文件根目录
        root   /usr/share/nginx/html;
        index  pages/index.html;
        
        # 处理前端路由
        location / {
            try_files $uri $uri/ /pages/index.html;
        }
        
        # API代理到后端服务
        location /api/ {
            proxy_pass http://backend:8000/api/;  # 假设后端API依然以/api开头，或者根据实际情况调整。
            # 如果后端完全没有前缀，这可能需要调整为 location / { ... } 但这会与前端冲突。
            # 既然 API_V1_STR="", 那么 endpoints 应该直接在 /session, /chat 等下面。
            # 为了避免冲突，前端请求API时最好还是加上 /api/ 前缀，然后 Nginx rewrite 掉，或者后端加上 /api 前缀。
            # 但既然用户要求删除nginx前缀，我们假设前端请求 URL 已经变更或者后端根路径处理。
            
            # 暂时保留 /api/ 匹配，但 proxy_pass 到 backend:8000/
            # 这样请求 /api/session/initiate -> backend:8000/session/initiate
        }
        
        # 针对具体 endpoint 进行代理，防止 /api/ 前缀被后端拒绝（如果你后端确实是挂在根目录）
        location /session/ {
            proxy_pass http://backend:8000/session/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /chat/ {
            proxy_pass http://backend:8000/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket代理到后端服务
        location /ws/ {
            proxy_pass http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        
        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}